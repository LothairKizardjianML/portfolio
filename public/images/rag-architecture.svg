<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">RAG chatbot architecture</title>
  <desc id="d">Ingestion: PDFs are loaded, chunked, embedded and stored in Chroma. Query: the question is embedded, the top-k similar chunks are retrieved from Chroma, combined into a prompt and answered by Llama 3.1 8B.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9aa8"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c5cff"/>
    </marker>
    <style>
      text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .box{fill:#14141c;stroke:rgba(255,255,255,.14);stroke-width:1.2}
      .hi{fill:rgba(124,92,255,.16);stroke:#7c5cff;stroke-width:1.5}
      .t{fill:#f5f5f7;font-size:15px;font-weight:600;text-anchor:middle}
      .s{fill:#9a9aa8;font-size:11.5px;text-anchor:middle}
      .lbl{fill:#9a9aa8;font-size:12px;letter-spacing:.14em;font-weight:600}
      .acc{fill:#b4a0ff;font-size:11.5px}
      .ln{stroke:#9a9aa8;stroke-width:1.5;fill:none}
      .lna{stroke:#7c5cff;stroke-width:1.8;fill:none}
    </style>
  </defs>
  <rect width="1000" height="520" rx="16" fill="#0d0d14" stroke="rgba(255,255,255,.1)"/>

  <!-- Ingestion -->
  <text class="lbl" x="50" y="58">INGESTION · ONCE PER DOCUMENT</text>
  <g>
    <rect class="box" x="50" y="80" width="130" height="72" rx="10"/>
    <text class="t" x="115" y="112">PDFs</text><text class="s" x="115" y="132">ingestion folder</text>
    <rect class="box" x="204" y="80" width="130" height="72" rx="10"/>
    <text class="t" x="269" y="112">Load</text><text class="s" x="269" y="132">PDF → raw text</text>
    <rect class="box" x="358" y="80" width="130" height="72" rx="10"/>
    <text class="t" x="423" y="112">Chunk</text><text class="s" x="423" y="132">recursive + overlap</text>
    <rect class="hi" x="512" y="80" width="130" height="72" rx="10"/>
    <text class="t" x="577" y="112">Embed</text><text class="s" x="577" y="132">snowflake-arctic 33m</text>
    <rect class="hi" x="666" y="80" width="130" height="72" rx="10"/>
    <text class="t" x="731" y="112">Chroma</text><text class="s" x="731" y="132">vector store</text>
  </g>
  <g class="ln" marker-end="url(#a)">
    <path d="M180 116H202" marker-end="url(#a)"/>
    <path d="M334 116H356" marker-end="url(#a)"/>
    <path d="M488 116H510" marker-end="url(#a)"/>
  </g>
  <path class="lna" d="M642 116H664" marker-end="url(#ac)"/>

  <!-- Divider -->
  <line x1="50" y1="262" x2="950" y2="262" stroke="rgba(255,255,255,.08)" stroke-dasharray="4 6"/>

  <!-- Query -->
  <text class="lbl" x="50" y="300">QUERY · EVERY QUESTION</text>
  <g>
    <rect class="box" x="50" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="115" y="354">Question</text><text class="s" x="115" y="374">user message</text>
    <rect class="hi" x="204" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="269" y="354">Embed</text><text class="s" x="269" y="374">same model</text>
    <rect class="box" x="358" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="423" y="354">Top-k</text><text class="s" x="423" y="374">cosine similarity</text>
    <rect class="box" x="512" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="577" y="354">Prompt</text><text class="s" x="577" y="374">chunks + question</text>
    <rect class="hi" x="666" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="731" y="354">Llama 3.1 8B</text><text class="s" x="731" y="374">Ollama · Q4_K_M</text>
    <rect class="box" x="820" y="322" width="130" height="72" rx="10"/>
    <text class="t" x="885" y="354">Answer</text><text class="s" x="885" y="374">grounded in docs</text>
  </g>
  <g class="ln">
    <path d="M180 358H202" marker-end="url(#a)"/>
    <path d="M334 358H356" marker-end="url(#a)"/>
    <path d="M488 358H510" marker-end="url(#a)"/>
    <path d="M642 358H664" marker-end="url(#a)"/>
    <path d="M796 358H818" marker-end="url(#a)"/>
  </g>

  <!-- Chroma -> Top-k -->
  <path class="lna" d="M731 152V210H423V320" stroke-linejoin="round" marker-end="url(#ac)"/>
  <text class="acc" x="440" y="202">stored chunk vectors</text>

  <!-- Footer -->
  <text class="s" x="500" y="466" style="text-anchor:middle">Both models stay resident in VRAM together · RTX 3070, 8 GB</text>
</svg>
